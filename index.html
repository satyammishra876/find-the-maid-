<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the maid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__location">  
       <img src="./images/icon.svg" alt="map" class="map-icon">
       <span class="location--Name">Gurgaon</span>
         </div>

       <div class="search__box">
        <img src="./images/search icon.svg" alt="search" class="search-icon">
        <input type="text" placeholder="Search cleaning, cooking ..." class="search-input">
       </div>
<div class="header__nav-right">  
    <div class="links">
           <a href="#">Home</a>
       <a href="#">Booking</a>
       <a href="#">Chat</a>
       <a href="#">Profile</a>

    
     

       <img src="./images/notifaction.svg" alt="notification"class="notification">
</div>
 </div>

</header> 
    

<div class="main-content">
    <div class="section-header">   
    <h4 class="heading--main">Popular Services</h4> 

    <a href="#" class="main__content-links">View more >></a>   
  </div>  
  
  

    <div class="images">
        <div class="service-card"> 
        <img src="./images/cleaing.svg" alt="cleaing" class="types">
        <span>cleaing</span>
        </div>

        <div class="service-card"> 
        <img src="./images/Cooking.svg" alt="Cooking" class="types">
        <span>Cooking</span>
        </div>

        <div class="service-card"> 
        <img src="./images/babyCare.svg" alt="babyCare" class="types">
        <span>babyCare</span>
</div>


<div class="service-card"> 
        <img src="./images/FullTimeMaid.svg" alt="FullTimeMaid" class="types">
        <span>FullTimeMaid</span>
    </div>
</div>
    </div>

</div>

<div class="maid-section">
    
    <div class="section-header">
      
        <h4 class="heading--main">Available Near You</h4>
          <a href="#" class="main__content-links">View more >></a>   
    </div>
    
    <div class="maid-grid"> 
    
        <div class="profile-card"> 
            
            <img src="./images/FullTimeMaid.svg" alt="FullTimeMaid">
            
            <div class="profile-info">
                <h3>Sarla Devi</h3>
                <p class="rating">★ 4.5(128)</p>
                <p class="price">₹200 /hr</p>
            </div>
        </div>


        <div class="profile-card"> 
            <img src="./images/FullTimeMaid.svg" alt="Anita Sharma">
            <div class="profile-info">
                <h3>Anita Sharma</h3>
                <p class="rating">★ 4.5(128)</p>
                <p class="price">₹220 /hr</p>
            </div>
        </div>

    
        <div class="profile-card"> 
            <img src="./images/FullTimeMaid.svg" alt="Priya Patel">
            <div class="profile-info">
                <h3>Priya Patel</h3>
                <p class="rating">★ 4.5(128)</p>
                <p class="price">₹190 /hr</p>
            </div>
        </div>

        
        <div class="profile-card"> 
            <img src="./images/FullTimeMaid.svg" alt="Panta Pacel">
            <div class="profile-info">
                <h3>Panta Pacel</h3>
                <p class="rating">★ 4.5(128)</p>
                <p class="price">₹190 /hr</p>
            </div>
        </div>
    </div>
</div>

</body>
<script src="script.js"></script>
</html>
